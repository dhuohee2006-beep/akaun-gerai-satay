<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akaun Gerai Satay</title>
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="icon" id="fav">
<link rel="apple-touch-icon" id="ati">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#c2410c;--pd:#9a3412;--bg:#fff7ed;--c:#fff;--t:#1c1917;--m:#78716c;--b:#e7e5e4;--g:#15803d;--r:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
header{background:var(--p);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:17px;margin:0}
#st{font-size:12px;opacity:.95}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:6px;padding:5px 9px;font-size:12px;margin-left:6px}
main{max-width:900px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;min-width:64px;border:0;background:none;padding:8px 4px;font-size:11px;color:var(--m)}
nav button b{display:block;font-size:18px}
nav button.on{color:var(--p);font-weight:700}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--b);border-radius:12px;padding:10px}
.kpi small{color:var(--m)}.kpi div{font-size:20px;font-weight:700}
.pos{color:var(--g)}.neg{color:var(--r)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
input,select{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;font-size:15px;background:#fff}
button.pri{background:var(--p);color:#fff;border:0;border-radius:8px;padding:10px;font-size:15px;font-weight:600}
button.sm{border:1px solid var(--b);background:#fff;border-radius:6px;padding:3px 8px;font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right}
.tag{padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600}
.ok{background:#dcfce7;color:var(--g)}.no{background:#fee2e2;color:var(--r)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row>*{flex:1;min-width:110px}
#auth{max-width:380px;margin:12vh auto;padding:20px}
#auth input{margin-bottom:10px}
.err{color:var(--r);font-size:13px;min-height:18px}
.warn{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:8px;margin-bottom:8px;font-size:13px}
.stmt{background:#fff;padding:16px}
.stmt h2,.stmt h4{text-align:center;margin:2px 0}
.stmt td.n{width:110px}
.tot td{font-weight:700;border-top:1px solid #000}
.dbl td{border-bottom:3px double #000}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;padding:0}.card{border:0}}
</style>
</head>
<body>
<div id="auth" class="card" style="display:none">
  <h2 style="margin-top:0">🍢 Akaun Gerai Satay</h2>
  <input id="em" type="email" placeholder="Emel" autocomplete="email">
  <input id="pw" type="password" placeholder="Kata laluan (min 6 aksara)" autocomplete="current-password">
  <div class="err" id="ae"></div>
  <button class="pri" style="width:100%;margin-bottom:8px" onclick="login()">Log Masuk</button>
  <button class="sm" style="width:100%;padding:9px" onclick="signup()">Daftar Akaun Baru</button>
</div>
<div id="app" style="display:none">
  <header><h1>🍢 Gerai Satay</h1><div><span id="st"></span><button onclick="logout()">Keluar</button></div></header>
  <main id="v"></main>
  <nav id="nav"></nav>
</div>

<script>
/* ====== KONFIGURASI SUPABASE ====== */
const SUPABASE_URL='https://uttgwcuotlezluuhdulu.supabase.co'; // <-- tukar dengan URL projek anda
const SUPABASE_KEY='sb_publishable_ak5NUZXwvZ-pmENoeWq1iA_cj9J2O9q';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ====== PWA: manifest + ikon SVG gerai satay ====== */
const ICON='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#c2410c"/><g stroke="#fde68a" stroke-width="10" stroke-linecap="round"><line x1="70" y1="410" x2="440" y2="110"/><line x1="110" y1="440" x2="470" y2="150"/></g><g fill="#7c2d12"><rect x="150" y="260" width="70" height="52" rx="16" transform="rotate(-39 185 286)"/><rect x="225" y="200" width="70" height="52" rx="16" transform="rotate(-39 260 226)"/><rect x="300" y="140" width="70" height="52" rx="16" transform="rotate(-39 335 166)"/></g><path d="M90 450q40-40 80 0" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/></svg>';
const ICON_URI='data:image/svg+xml,'+encodeURIComponent(ICON);
(function(){
  const mf={name:'Akaun Gerai Satay',short_name:'Gerai Satay',description:'Aplikasi perakaunan gerai satay',start_url:'.',scope:'.',display:'standalone',orientation:'portrait',background_color:'#fff7ed',theme_color:'#c2410c',lang:'ms',
    icons:[{src:ICON_URI,sizes:'any',type:'image/svg+xml',purpose:'any'},{src:ICON_URI,sizes:'512x512',type:'image/svg+xml',purpose:'maskable'}]};
  document.getElementById('mf').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(mf));
  document.getElementById('fav').href=ICON_URI;document.getElementById('ati').href=ICON_URI;
})();

/* ====== DATA ====== */
const CATS=['Bahan Mentah Ayam/Daging','Arang','Lidi','Kuah Kacang','Sewa Tapak','Gaji Pekerja','Utiliti','Lain-lain'];
const METHODS=['Tunai','QR DuitNow','Pemindahan Bank'];
let D={modal:0,sales:[],exp:[],items:[],log:[],cash:[]};
let user=null,tab='home',saveT=null,F={sm:'',ss:'',em:'',es:''};
const today=()=>new Date().toISOString().slice(0,10);
let selDate=today(),selMonth=today().slice(0,7);
const $=id=>document.getElementById(id);
const rm=n=>'RM '+(Number(n)||0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const pill=p=>`<span class="tag ${p?'ok':'no'}">${p?'Sudah Bayar':'Belum Bayar'}</span>`;

/* ====== AUTH ====== */
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)$('ae').textContent=error.message}
async function signup(){const{data,error}=await sb.auth.signUp({email:$('em').value.trim(),password:$('pw').value});
  $('ae').textContent=error?error.message:(data.session?'':'Daftar berjaya. Semak emel untuk pengesahan, kemudian log masuk.')}
async function logout(){await sb.auth.signOut()}
sb.auth.onAuthStateChange((_e,s)=>{setTimeout(()=>onSession(s?.user||null),0)});
sb.auth.getSession().then(({data})=>onSession(data.session?.user||null));
async function onSession(u){
  if(u&&user&&u.id===user.id)return;
  user=u;
  if(!u){$('app').style.display='none';$('auth').style.display='block';return}
  $('auth').style.display='none';$('app').style.display='block';
  setSt('Memuatkan…');
  const{data,error}=await sb.from('gerai_records').select('data').eq('user_id',u.id).maybeSingle();
  if(error){setSt('Ralat muat: '+error.message);}
  else if(data&&data.data&&Object.keys(data.data).length){D=Object.assign({modal:0,sales:[],exp:[],items:[],log:[],cash:[]},data.data);setSt('Disimpan ke awan ✓')}
  else{await saveNow()}
  buildNav();render();
}

/* ====== SIMPAN KE AWAN ====== */
function setSt(t){$('st').textContent=t}
function save(){setSt('Menyimpan…');clearTimeout(saveT);saveT=setTimeout(saveNow,600)}
async function saveNow(){
  if(!user)return;
  const{error}=await sb.from('gerai_records').upsert({user_id:user.id,data:D,updated_at:new Date().toISOString()});
  setSt(error?'Gagal simpan ✗ '+error.message:'Disimpan ke awan ✓');
}

/* ====== NAV ====== */
const TABS=[['home','📊','Ringkasan'],['sales','💰','Jualan'],['exp','🧾','Belanja'],['stock','📦','Stok'],['cash','🔁','Tunai'],['stmt','📑','Penyata']];
function buildNav(){$('nav').innerHTML=TABS.map(t=>`<button id="n_${t[0]}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}
function go(t){tab=t;render()}
function render(){
  TABS.forEach(t=>{const b=$('n_'+t[0]);if(b)b.classList.toggle('on',t[0]===tab)});
  $('v').innerHTML=({home:vHome,sales:vSales,exp:vExp,stock:vStock,cash:vCash,stmt:vStmt})[tab]();
}
const pf=(...a)=>a.map(parseFloat);

/* ====== STOK HELPER ====== */
function itemStat(id,upto='9999-99-99'){
  const L=D.log.filter(l=>l.item===id&&l.date<=upto);
  const qin=sum(L.filter(l=>l.type==='in'),l=>l.qty),qout=sum(L.filter(l=>l.type==='out'),l=>l.qty);
  const vin=sum(L.filter(l=>l.type==='in'),l=>l.amt),vout=sum(L.filter(l=>l.type==='out'),l=>l.amt);
  return{qty:qin-qout,val:vin-vout,qin,qout};
}

/* ====== LAPORAN HARIAN (RINGKASAN) ====== */
function dayCalc(d){
  const sales=sum(D.sales.filter(x=>x.date===d),x=>x.amt);
  const cogs=sum(D.log.filter(l=>l.date===d&&l.type==='out'),l=>l.amt);
  const exp=sum(D.exp.filter(x=>x.date===d),x=>x.amt);
  return{sales,cogs,exp,profit:sales-cogs-exp};
}
function vHome(){
  const c=dayCalc(selDate);
  const low=D.items.filter(i=>itemStat(i.id).qty<=i.min);
  const unpaid=sum(D.sales.filter(s=>!s.paid),s=>s.amt);
  return `<div class="card"><div class="row"><label style="flex:2"><b>Laporan Untung Harian</b></label><input type="date" value="${selDate}" onchange="selDate=this.value;render()"></div>
  <div class="grid">
   <div class="kpi"><small>Jualan</small><div>${rm(c.sales)}</div></div>
   <div class="kpi"><small>Kos Bahan Digunakan</small><div>${rm(c.cogs)}</div></div>
   <div class="kpi"><small>Belanja</small><div>${rm(c.exp)}</div></div>
   <div class="kpi"><small>Untung / (Rugi)</small><div class="${c.profit>=0?'pos':'neg'}">${rm(c.profit)}</div></div>
  </div></div>
  <div class="card"><h3>Perhatian</h3>
   ${low.length?low.map(i=>`<div class="warn">⚠️ Stok rendah: <b>${esc(i.name)}</b> — baki ${itemStat(i.id).qty} ${esc(i.unit)} (min ${i.min})</div>`).join(''):'<div style="color:var(--m);font-size:13px">Tiada amaran stok rendah.</div>'}
   <div style="margin-top:8px;font-size:14px">Jualan belum dibayar (semua): <b class="neg">${rm(unpaid)}</b></div></div>
  <div class="card"><h3>Modal Permulaan</h3><form onsubmit="event.preventDefault();D.modal=parseFloat(this.m.value)||0;save();render()">
   <input name="m" type="number" step="0.01" value="${D.modal}"><button class="pri">Kemaskini</button></form></div>`;
}

/* ====== JUALAN + PAYMENT TRACKING ====== */
function addSale(e){e.preventDefault();const f=e.target;
  D.sales.push({id:uid(),date:f.date.value,desc:f.desc.value||'Jualan satay',amt:parseFloat(f.amt.value)||0,method:f.method.value,paid:f.paid.value==='1'});
  save();render()}
function vSales(){
  let L=D.sales.filter(s=>(!F.sm||s.method===F.sm)&&(!F.ss||String(+s.paid)===F.ss)).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card"><h3>Rekod Jualan</h3><form onsubmit="addSale(event)">
   <input type="date" name="date" value="${today()}" required>
   <input name="desc" placeholder="Keterangan (cth: 50 cucuk ayam)">
   <input type="number" step="0.01" name="amt" placeholder="Jumlah RM" required>
   <select name="method">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select>
   <select name="paid"><option value="1">Sudah Bayar</option><option value="0">Belum Bayar</option></select>
   <button class="pri">Tambah</button></form></div>
  <div class="card"><h3>Senarai & Tapisan</h3><div class="row">
   <select onchange="F.sm=this.value;render()"><option value="">Semua kaedah</option>${METHODS.map(m=>`<option ${F.sm===m?'selected':''}>${m}</option>`).join('')}</select>
   <select onchange="F.ss=this.value;render()"><option value="">Semua status</option><option value="1" ${F.ss==='1'?'selected':''}>Sudah Bayar</option><option value="0" ${F.ss==='0'?'selected':''}>Belum Bayar</option></select></div>
   <div class="tw"><table><tr><th>Tarikh</th><th>Butiran</th><th>Kaedah</th><th>Status</th><th class="n">RM</th><th></th></tr>
   ${L.map(s=>`<tr><td>${s.date}</td><td>${esc(s.desc)}</td><td>${s.method}</td><td>${pill(s.paid)}</td><td class="n">${s.amt.toFixed(2)}</td>
   <td><button class="sm" onclick="togSale('${s.id}')">Tukar status</button> <button class="sm" onclick="del('sales','${s.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=6>Tiada rekod</td></tr>'}
   <tr class="tot"><td colspan=4>Jumlah</td><td class="n">${sum(L,s=>s.amt).toFixed(2)}</td><td></td></tr></table></div></div>`;
}
function togSale(id){const s=D.sales.find(x=>x.id===id);s.paid=!s.paid;save();render()}
function del(k,id){if(!confirm('Padam rekod ini?'))return;D[k]=D[k].filter(x=>x.id!==id);save();render()}

/* ====== BELANJA HARIAN ====== */
function addExp(e){e.preventDefault();const f=e.target;
  D.exp.push({id:uid(),date:f.date.value,cat:f.cat.value,desc:f.desc.value,amt:parseFloat(f.amt.value)||0,method:f.method.value,paid:f.paid.value==='1'});
  save();render()}
function vExp(){
  let L=D.exp.filter(s=>(!F.em||s.cat===F.em)&&(!F.es||String(+s.paid)===F.es)).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card"><h3>Rekod Belanja Harian</h3><form onsubmit="addExp(event)">
   <input type="date" name="date" value="${today()}" required>
   <select name="cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
   <input name="desc" placeholder="Keterangan">
   <input type="number" step="0.01" name="amt" placeholder="Jumlah RM" required>
   <select name="method">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select>
   <select name="paid"><option value="1">Sudah Bayar</option><option value="0">Belum Bayar (hutang)</option></select>
   <button class="pri">Tambah</button></form></div>
  <div class="card"><h3>Senarai</h3><div class="row">
   <select onchange="F.em=this.value;render()"><option value="">Semua kategori</option>${CATS.map(c=>`<option ${F.em===c?'selected':''}>${c}</option>`).join('')}</select>
   <select onchange="F.es=this.value;render()"><option value="">Semua status</option><option value="1" ${F.es==='1'?'selected':''}>Sudah Bayar</option><option value="0" ${F.es==='0'?'selected':''}>Belum Bayar</option></select></div>
   <div class="tw"><table><tr><th>Tarikh</th><th>Kategori</th><th>Butiran</th><th>Status</th><th class="n">RM</th><th></th></tr>
   ${L.map(s=>`<tr><td>${s.date}</td><td>${esc(s.cat)}</td><td>${esc(s.desc)}</td><td>${pill(s.paid)}</td><td class="n">${s.amt.toFixed(2)}</td>
   <td><button class="sm" onclick="togExp('${s.id}')">Tukar status</button> <button class="sm" onclick="del('exp','${s.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=6>Tiada rekod</td></tr>'}
   <tr class="tot"><td colspan=4>Jumlah</td><td class="n">${sum(L,s=>s.amt).toFixed(2)}</td><td></td></tr></table></div></div>`;
}
function togExp(id){const s=D.exp.find(x=>x.id===id);s.paid=!s.paid;save();render()}

/* ====== STOK ====== */
function addItem(e){e.preventDefault();const f=e.target;
  D.items.push({id:uid(),name:f.name.value,unit:f.unit.value||'kg',min:parseFloat(f.min.value)||0});save();render()}
function stockIn(e){e.preventDefault();const f=e.target;
  D.log.push({id:uid(),date:f.date.value,item:f.item.value,type:'in',qty:parseFloat(f.qty.value)||0,amt:parseFloat(f.amt.value)||0});save();render()}
function stockOut(e){e.preventDefault();const f=e.target;
  const st=itemStat(f.item.value),q=parseFloat(f.qty.value)||0;
  if(q>st.qty&&!confirm('Kuantiti melebihi baki stok. Teruskan?'))return;
  const amt=st.qty>0?Math.min(q,st.qty)*(st.val/st.qty):0;
  D.log.push({id:uid(),date:f.date.value,item:f.item.value,type:'out',qty:q,amt:+amt.toFixed(2)});save();render()}
function vStock(){
  const opts=D.items.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('');
  const nm=id=>esc((D.items.find(i=>i.id===id)||{}).name||'?');
  return `<div class="card"><h3>Tambah Bahan Mentah</h3><form onsubmit="addItem(event)">
   <input name="name" placeholder="Nama (cth: Daging ayam)" required><input name="unit" placeholder="Unit (kg/biji/bungkus)">
   <input name="min" type="number" step="0.01" placeholder="Paras amaran min"><button class="pri">Tambah</button></form></div>
  <div class="card"><h3>Baki Stok Semasa</h3><div class="tw"><table><tr><th>Bahan</th><th class="n">Baki</th><th class="n">Nilai RM</th><th>Status</th><th></th></tr>
   ${D.items.map(i=>{const s=itemStat(i.id),low=s.qty<=i.min;return `<tr><td>${esc(i.name)}</td><td class="n">${+s.qty.toFixed(2)} ${esc(i.unit)}</td><td class="n">${s.val.toFixed(2)}</td>
   <td>${low?'<span class="tag no">⚠ Rendah</span>':'<span class="tag ok">OK</span>'}</td><td><button class="sm" onclick="delItem('${i.id}')">✕</button></td></tr>`}).join('')||'<tr><td colspan=5>Tiada bahan</td></tr>'}</table></div></div>
  <div class="card"><h3>Stok Masuk (Beli)</h3><form onsubmit="stockIn(event)">
   <input type="date" name="date" value="${today()}" required><select name="item" required>${opts}</select>
   <input type="number" step="0.01" name="qty" placeholder="Kuantiti" required><input type="number" step="0.01" name="amt" placeholder="Jumlah bayar RM" required><button class="pri">Masuk</button></form></div>
  <div class="card"><h3>Stok Guna Harian</h3><form onsubmit="stockOut(event)">
   <input type="date" name="date" value="${today()}" required><select name="item" required>${opts}</select>
   <input type="number" step="0.01" name="qty" placeholder="Kuantiti guna" required><button class="pri">Guna</button></form></div>
  <div class="card"><h3>Sejarah Stok</h3><div class="tw"><table><tr><th>Tarikh</th><th>Bahan</th><th>Jenis</th><th class="n">Kuantiti</th><th class="n">RM</th><th></th></tr>
   ${[...D.log].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(l=>`<tr><td>${l.date}</td><td>${nm(l.item)}</td><td>${l.type==='in'?'Masuk':'Guna'}</td><td class="n">${l.qty}</td><td class="n">${l.amt.toFixed(2)}</td><td><button class="sm" onclick="del('log','${l.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=6>Tiada</td></tr>'}</table></div></div>`;
}
function delItem(id){if(!confirm('Padam bahan & sejarahnya?'))return;D.items=D.items.filter(i=>i.id!==id);D.log=D.log.filter(l=>l.item!==id);save();render()}

/* ====== ALIRAN TUNAI ====== */
function addCash(e){e.preventDefault();const f=e.target;
  D.cash.push({id:uid(),date:f.date.value,type:f.type.value,desc:f.desc.value,amt:parseFloat(f.amt.value)||0});save();render()}
function vCash(){
  const inn=sum(D.cash.filter(c=>c.type==='in'),c=>c.amt),out=sum(D.cash.filter(c=>c.type==='out'),c=>c.amt);
  const pc=cashPosition();
  return `<div class="card"><h3>Aliran Tunai Masuk / Keluar</h3><p style="font-size:12px;color:var(--m);margin-top:0">Gunakan untuk tambahan modal (masuk) atau ambilan pemilik (keluar). Jualan, belanja & belian stok dikira automatik.</p>
  <form onsubmit="addCash(event)"><input type="date" name="date" value="${today()}" required>
   <select name="type"><option value="in">Tunai Masuk (tambah modal)</option><option value="out">Tunai Keluar (ambilan)</option></select>
   <input name="desc" placeholder="Keterangan"><input type="number" step="0.01" name="amt" placeholder="RM" required><button class="pri">Tambah</button></form></div>
  <div class="grid"><div class="kpi"><small>Masuk</small><div class="pos">${rm(inn)}</div></div><div class="kpi"><small>Keluar</small><div class="neg">${rm(out)}</div></div><div class="kpi"><small>Baki Tunai & Bank</small><div>${rm(pc)}</div></div></div><br>
  <div class="card"><div class="tw"><table><tr><th>Tarikh</th><th>Jenis</th><th>Butiran</th><th class="n">RM</th><th></th></tr>
   ${[...D.cash].sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<tr><td>${c.date}</td><td>${c.type==='in'?'Masuk':'Keluar'}</td><td>${esc(c.desc)}</td><td class="n">${c.amt.toFixed(2)}</td><td><button class="sm" onclick="del('cash','${c.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=5>Tiada</td></tr>'}</table></div></div>`;
}
function cashPosition(upto='9999-99-99'){
  const le=x=>x.date<=upto;
  return (+D.modal||0)
   +sum(D.cash.filter(c=>le(c)&&c.type==='in'),c=>c.amt)-sum(D.cash.filter(c=>le(c)&&c.type==='out'),c=>c.amt)
   +sum(D.sales.filter(s=>le(s)&&s.paid),s=>s.amt)-sum(D.exp.filter(s=>le(s)&&s.paid),s=>s.amt)
   -sum(D.log.filter(l=>le(l)&&l.type==='in'),l=>l.amt);
}

/* ====== PENYATA KEWANGAN MFRS 101 ====== */
function vStmt(){
  const m=selMonth,end=m+'-31',inM=x=>x.date.slice(0,7)===m;
  const rev=sum(D.sales.filter(inM),s=>s.amt);
  const cogs=sum(D.log.filter(l=>inM(l)&&l.type==='out'),l=>l.amt);
  const gp=rev-cogs;
  const byCat=CATS.map(c=>[c,sum(D.exp.filter(e=>inM(e)&&e.cat===c),e=>e.amt)]).filter(x=>x[1]);
  const opex=sum(byCat,x=>x[1]),np=gp-opex;
  // SOFP pada akhir bulan
  const cash=cashPosition(end);
  const ar=sum(D.sales.filter(s=>s.date<=end&&!s.paid),s=>s.amt);
  const inv=sum(D.log.filter(l=>l.date<=end&&l.type==='in'),l=>l.amt)-sum(D.log.filter(l=>l.date<=end&&l.type==='out'),l=>l.amt);
  const ap=sum(D.exp.filter(e=>e.date<=end&&!e.paid),e=>e.amt);
  const ret=sum(D.sales.filter(s=>s.date<=end),s=>s.amt)-sum(D.log.filter(l=>l.date<=end&&l.type==='out'),l=>l.amt)-sum(D.exp.filter(e=>e.date<=end),e=>e.amt);
  const add=sum(D.cash.filter(c=>c.date<=end&&c.type==='in'),c=>c.amt),draw=sum(D.cash.filter(c=>c.date<=end&&c.type==='out'),c=>c.amt);
  const cap=(+D.modal||0)+add-draw;
  const ta=cash+ar+inv,eq=cap+ret,tel=eq+ap;
  const R=(l,v,c='')=>`<tr class="${c}"><td>${l}</td><td class="n">${v===null?'':v.toFixed(2)}</td></tr>`;
  const mn=new Date(m+'-01').toLocaleDateString('ms-MY',{month:'long',year:'numeric'});
  const endTxt=new Date(m+'-01');endTxt.setMonth(endTxt.getMonth()+1,0);
  return `<div class="card noprint"><div class="row"><label style="flex:2"><b>Penyata Kewangan Bulanan</b></label><input type="month" value="${m}" onchange="selMonth=this.value;render()"><button class="pri" onclick="window.print()">🖨 Cetak / Simpan PDF</button></div></div>
  <div class="card stmt"><h2>GERAI SATAY</h2><h4>PENYATA UNTUNG RUGI DAN PENDAPATAN KOMPREHENSIF LAIN</h4><h4>Bagi bulan berakhir ${endTxt.toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'})}</h4>
  <div class="tw"><table><tr><th></th><th class="n">RM</th></tr>
   ${R('Hasil (Jualan)',rev)}${R('Kos jualan (bahan mentah digunakan)',-cogs)}${R('Untung kasar',gp,'tot')}
   ${R('<i>Perbelanjaan operasi:</i>',null)}${byCat.map(x=>R('&nbsp;&nbsp;'+esc(x[0]),x[1])).join('')}${R('Jumlah perbelanjaan operasi',-opex,'tot')}
   ${R('Untung / (Rugi) bagi bulan',np,'tot dbl')}${R('Pendapatan komprehensif lain',0)}${R('Jumlah pendapatan komprehensif',np,'tot dbl')}</table></div></div>
  <div class="card stmt" style="page-break-before:always"><h2>GERAI SATAY</h2><h4>PENYATA KEDUDUKAN KEWANGAN</h4><h4>Pada ${endTxt.toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'})}</h4>
  <div class="tw"><table><tr><th></th><th class="n">RM</th></tr>
   ${R('<b>ASET SEMASA</b>',null)}${R('&nbsp;&nbsp;Tunai dan baki bank',cash)}${R('&nbsp;&nbsp;Penghutang perdagangan',ar)}${R('&nbsp;&nbsp;Inventori (bahan mentah)',inv)}${R('JUMLAH ASET',ta,'tot dbl')}
   ${R('<b>EKUITI</b>',null)}${R('&nbsp;&nbsp;Modal pemilik (termasuk tambahan, tolak ambilan)',cap)}${R('&nbsp;&nbsp;Untung terkumpul',ret)}${R('Jumlah ekuiti',eq,'tot')}
   ${R('<b>LIABILITI SEMASA</b>',null)}${R('&nbsp;&nbsp;Pemiutang perdagangan & belanja belum bayar',ap)}${R('JUMLAH EKUITI DAN LIABILITI',tel,'tot dbl')}</table></div>
   <p style="font-size:11px;color:var(--m)">Disediakan mengikut kerangka MFRS 101 (Pembentangan Penyata Kewangan) secara ringkas. Asas akruan; inventori dinilai pada kos purata wajaran. Semak dengan akauntan berlesen sebelum diguna untuk tujuan statutori/cukai.</p></div>`;
}
</script>
